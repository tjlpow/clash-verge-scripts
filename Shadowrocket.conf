# —— 自动测速子组（隐藏显示，供各策略组选择）——
# policy-regex-filter 从全部订阅节点里筛，等价于 Clash 的 filter
# (?i) 忽略大小写；\b 包住双字母代号，避免 US 误伤 RUS(俄罗斯)/AUS(澳大利亚)
⚡ Auto = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)^((?!流量倍率:(1\.\d+|[2-9])).)*$, hidden=1
💰 低倍率 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)^(?=.*倍率)(?=.*0\.).*$, hidden=1
🇺🇸 US 美国 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(USA?|United ?States)\b), hidden=1
🇯🇵 JP 日本 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇯🇵|日本|东京|大阪|(\b(JPN?|Japan)\b), hidden=1
🇭🇰 HK 香港 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇭🇰|香港|(\b(HKG?|Hong ?Kong)\b), hidden=1
🇸🇬 SG 新加坡 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇸🇬|新加坡|狮城|(\b(SGP?|Singapore)\b), hidden=1
🇹🇼 TW 台湾 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇹🇼|台湾|台北|(\b(TWN?|Taiwan)\b), hidden=1
🇰🇷 KR 韩国 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇰🇷|韩国|首尔|(\b(KOR?|Korea)\b), hidden=1
🇬🇧 UK 英国 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇬🇧|英国|伦敦|(\b(UK|GBR?|United ?Kingdom|Britain)\b), hidden=1
🇩🇪 DE 德国 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇩🇪|德国|法兰克福|(\b(DEU?|Germany)\b), hidden=1
🇳🇱 NL 荷兰 = url-test, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, timeout=5, select=0, policy-regex-filter=(?i)🇳🇱|荷兰|阿姆斯特丹|(\b(NLD?|Netherlands)\b), hidden=1

[Rule]
# 按顺序匹配，先命中先执行。

# 可选：屏蔽 QUIC（HTTP/3 走 UDP 443）。机场原配置把它放在第一条。
# Chrome 访问 Google 系大量用 QUIC，屏掉后浏览器退回 TCP/TLS，走向更可预期。
# 需要就取消下面这行的注释：
# AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP

# 1. 广告拦截
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Advertising/Advertising.list,REJECT

# 局域网 / 本地域名优先；IP 条目不主动触发域名解析。
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Lan/Lan.list,DIRECT,no-resolve

# 国内 AI 固定直连，先于国外 AI 与通用国内名单。
RULE-SET,https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/shadowrocket/cn.list,DIRECT

# 出口检测网站跟随主代理组，优先于国内通用名单。
# ChinaMax 域名集收录 browserleaks.com；明确例外可防止上游分类改变出口。
DOMAIN-SUFFIX,browserleaks.com,Proxy,force-remote-dns
DOMAIN-SUFFIX,whoer.net,Proxy,force-remote-dns
DOMAIN-SUFFIX,ipinfo.io,Proxy,force-remote-dns

# 国外 AI 优先于 Apple、站点组和普通国内名单。
RULE-SET,https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/shadowrocket/global.list,国外AI

# 2. iCloud —— ⚠️ 必须排在 Apple 之前！
#    blackmatrix7 的 Apple.list 里含 icloud 域名，放后面 iCloud 组就永远匹配不到
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/iCloud/iCloud.list,iCloud

# 3. Apple 直连（App Store 下载 / 系统更新，直连更快也不耗流量）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Apple/Apple.list,DIRECT

# 4a. 小米及 MiMo 官网、开放平台/API、桌面端与账号
# 国内模型由前方国内 AI 规则优先匹配。
DOMAIN-SUFFIX,mi.com,DIRECT
DOMAIN-SUFFIX,xiaomi.com,DIRECT
DOMAIN-SUFFIX,xiaomimimo.com,DIRECT
DOMAIN-SUFFIX,miui.com,DIRECT
DOMAIN-SUFFIX,miwifi.com,DIRECT

# 5. YouTube / X / bilibili（前两组用域名规则集，bilibili 用明确域名）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/YouTube/YouTube.list,YouTube
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Twitter/Twitter.list,X
# 参考 BilibiliHMT，覆盖主站、API、港澳台与常见视频 CDN；补上哔哩哔哩游戏域名。
# 默认直连，可在组里换节点。不照搬公用 IP-CIDR，避免误分流其他服务。
DOMAIN-SUFFIX,bilibili.com,bilibili
DOMAIN-SUFFIX,bilibili.tv,bilibili
DOMAIN-SUFFIX,bilibiligame.cn,bilibili
DOMAIN-SUFFIX,bilibiligame.co,bilibili
DOMAIN-SUFFIX,bilibiligame.net,bilibili
DOMAIN-SUFFIX,biligame.co,bilibili
DOMAIN-SUFFIX,biligame.com,bilibili
DOMAIN-SUFFIX,biligame.net,bilibili
DOMAIN-SUFFIX,acgvideo.com,bilibili
DOMAIN-SUFFIX,biliapi.net,bilibili
DOMAIN-SUFFIX,biliimg.com,bilibili
DOMAIN-SUFFIX,bilivideo.com,bilibili
DOMAIN-SUFFIX,hdslb.com,bilibili
DOMAIN-SUFFIX,b23.tv,bilibili
DOMAIN,p-bstarstatic.akamaized.net,bilibili
DOMAIN,p.bstarstatic.com,bilibili
DOMAIN,upos-bstar-mirrorakam.akamaized.net,bilibili
DOMAIN,upos-bstar1-mirrorakam.akamaized.net,bilibili
DOMAIN,upos-hz-mirrorakam.akamaized.net,bilibili

# Google 搜索、AI Mode 与静态资源单独选节点；Gemini 等先由上方海外 AI 规则集匹配
# force-remote-dns 避免这些代理域名被本地解析
DOMAIN-SUFFIX,google.com,Google,force-remote-dns
DOMAIN-SUFFIX,google.com.hk,Google,force-remote-dns
DOMAIN-SUFFIX,google.co.jp,Google,force-remote-dns
DOMAIN-SUFFIX,gstatic.com,Google,force-remote-dns
DOMAIN-SUFFIX,googleusercontent.com,Google,force-remote-dns

# 7. Telegram：本规则集同时包含域名和带 no-resolve 的 IP 规则，保留专属策略。
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Telegram/Telegram.list,Telegram

# 8. 手工直连补充
DOMAIN-SUFFIX,baidu.com,DIRECT
DOMAIN-SUFFIX,taobao.com,DIRECT
DOMAIN-SUFFIX,csdn.net,DIRECT
# qq.com 覆盖微信/QQ 域名；这些服务即使解析到境外 CDN IP 也按域名直连。
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,codebuddy.cn,DIRECT
DOMAIN-SUFFIX,workbuddy.cn,DIRECT

# 9. 国内服务直连：专属策略优先，通用域名先于 GEOIP。
# SukkaW 未提供 Shadowrocket 专用版本；此文本版使用 DOMAIN、DOMAIN-SUFFIX、
# DOMAIN-WILDCARD，须在手机端验证导入和匹配。
RULE-SET,https://ruleset.skk.moe/Clash/non_ip/domestic.txt,DIRECT
# 使用 DOMAIN-SET 读取纯域名文件，不引入整个 ChinaMax 的 IP、关键词或 UA 规则。
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT

# 国内 IP 兜底：保留解析，覆盖没有命中上述域名规则的国内地址。
GEOIP,CN,DIRECT

# 10. 未匹配流量交给独立兜底组。
FINAL,兜底

